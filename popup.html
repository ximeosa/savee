<!DOCTYPE html>
<html>
<head>
  <title>Advanced Bookmarker</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      width: 300px;
      padding: 15px; /* Slightly more padding for a less cramped feel */
      background-color: #1e1e1e; /* Dark grey background */
      color: #E0E0E0; /* Light grey text */
      margin: 0;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); /* Adjusted shadow for dark theme */
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff; /* White header text */
      margin: 0;
    }
    .bookmark-options button {
      display: inline-block; /* Or remove if flex handles it - flex will handle it */
      width: 48%;
      padding: 10px 5px;
      margin-bottom: 0;
      border: 1px solid #555555; /* Subtle border for buttons */
      border-radius: 6px; /* Slightly less rounded, more modern rect */
      background-color: #333333; /* Medium dark grey for buttons */
      color: #E0E0E0; /* Light grey button text */
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      box-sizing: border-box;
      text-align: center;
    }
    .bookmark-options button:hover {
      background-color: #454545; /* Lighter grey on hover */
      border-color: #777777;
      transform: translateY(-1px);
    }
    .bookmark-options button:active {
      transform: translateY(0px);
      background-color: #2a2a2a; /* Slightly darker on active */
    }
    .bookmark-options button[disabled] {
      background-color: #2a2a2a; /* Darker for disabled */
      color: #666666;
      border-color: #444444;
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }
    /* Specific button styles can be added later if different colors are desired for actions */

    /* Styles for button reorganization */
    .bookmark-options .button-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .bookmark-options .button-row:last-child {
      margin-bottom: 0; /* No margin for the last row before status/footer */
    }

    #statusMessage {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      color: #aaaaaa; /* Muted light grey for status */
      min-height: 16px;
      line-height: 1.4;
    }
    .footer-actions {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #444444; /* Darker separator line */
      text-align: center;
    }
    .footer-actions a {
      color: #bbbbbb; /* Lighter grey for link */
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .footer-actions a:hover {
      color: #ffffff; /* White on hover */
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Advanced Bookmarker</h1>
  </div>

  <div class="bookmark-options">
    <div class="button-row">
      <button id="bookmarkPageBtn" class="popup-action-button">Webpage</button>
      <button id="bookmarkWebsiteBtn" class="popup-action-button">Website</button>
    </div>
    <div class="button-row">
      <button id="bookmarkVideoBtn" class="popup-action-button">Video</button>
      <button id="bookmarkChannelBtn" class="popup-action-button">Channel</button>
    </div>
  </div>

  <div id="statusMessage"></div>

  <div class="footer-actions">
    <a href="#" id="viewBookmarksLink">View Saved Bookmarks</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
